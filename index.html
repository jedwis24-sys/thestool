<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STOOLVERSE — The Ultimate Barstool Database</title>

<style>

:root{
    --red:#e3262e;
    --red-light:#ff525a;
    --black:#070707;
    --dark:#0d0d0d;
    --panel:#151515;
    --panel2:#1d1d1d;
    --panel3:#252525;
    --line:#303030;
    --muted:#8d8d8d;
    --white:#f5f5f5;
    --gold:#d6a928;
    --green:#38b873;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:
        radial-gradient(circle at 100% 0%,rgba(227,38,46,.12),transparent 25%),
        radial-gradient(circle at 0% 100%,rgba(227,38,46,.05),transparent 25%),
        var(--black);
    color:var(--white);
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

.header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(7,7,7,.96);
    border-bottom:1px solid var(--line);
    backdrop-filter:blur(15px);
}

.nav{
    max-width:1800px;
    margin:auto;
    min-height:72px;
    padding:12px 25px;
    display:flex;
    align-items:center;
    gap:25px;
}

.logo{
    font-size:29px;
    font-weight:1000;
    letter-spacing:-2px;
    cursor:pointer;
    white-space:nowrap;
}

.logo span{
    color:var(--red);
}

.nav-links{
    display:flex;
    flex-wrap:wrap;
    gap:4px;
}

.nav-links button{
    border:0;
    background:transparent;
    color:#8c8c8c;
    padding:9px 11px;
    border-radius:5px;
    font-weight:900;
    font-size:12px;
}

.nav-links button:hover,
.nav-links button.active{
    color:white;
    background:var(--red);
}

.global-search{
    margin-left:auto;
    width:280px;
}

.global-search input{
    width:100%;
    background:#171717;
    border:1px solid #363636;
    color:white;
    padding:11px 13px;
    border-radius:6px;
    outline:none;
}

.global-search input:focus{
    border-color:var(--red);
}

.page{
    max-width:1800px;
    margin:auto;
    padding:35px 25px 100px;
}

.hero{
    min-height:500px;
    padding:65px;
    border:1px solid var(--line);
    border-radius:15px;
    position:relative;
    overflow:hidden;
    background:
        linear-gradient(115deg,rgba(227,38,46,.35),transparent 55%),
        linear-gradient(135deg,#202020,#080808);
}

.hero:before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:45px 45px;
    opacity:.45;
}

.hero:after{
    content:"STOOLVERSE";
    position:absolute;
    right:-40px;
    bottom:-60px;
    color:rgba(255,255,255,.025);
    font-size:150px;
    font-weight:1000;
    letter-spacing:-10px;
}

.hero-content{
    position:relative;
    z-index:2;
    max-width:950px;
}

.kicker{
    color:var(--red-light);
    font-size:11px;
    font-weight:1000;
    text-transform:uppercase;
    letter-spacing:2px;
    margin-bottom:15px;
}

h1{
    margin:0 0 25px;
    font-size:clamp(55px,8vw,115px);
    line-height:.84;
    letter-spacing:-8px;
}

h2{
    margin:0 0 18px;
    font-size:38px;
    letter-spacing:-2px;
}

h3{
    margin:0 0 10px;
}

.red{
    color:var(--red);
}

.hero p{
    max-width:850px;
    color:#aaa;
    font-size:19px;
    line-height:1.65;
}

.button-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:28px;
}

.primary-btn,
.secondary-btn,
.gold-btn{
    border-radius:6px;
    padding:12px 17px;
    font-weight:1000;
    border:0;
}

.primary-btn{
    background:var(--red);
    color:white;
}

.primary-btn:hover{
    background:var(--red-light);
}

.secondary-btn{
    background:#242424;
    border:1px solid #3b3b3b;
    color:white;
}

.secondary-btn:hover{
    border-color:var(--red);
}

.gold-btn{
    background:var(--gold);
    color:#111;
}

.stats{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:12px;
    margin-top:25px;
}

.stat{
    background:var(--panel);
    border:1px solid var(--line);
    padding:20px;
    border-radius:8px;
}

.stat-number{
    color:var(--red);
    font-size:34px;
    font-weight:1000;
}

.stat-label{
    color:#777;
    font-size:10px;
    font-weight:1000;
    margin-top:5px;
}

.section{
    margin-top:48px;
}

.section-header{
    display:flex;
    align-items:end;
    justify-content:space-between;
    gap:20px;
    margin-bottom:20px;
}

.section-header p{
    color:#777;
    margin:0;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(235px,1fr));
    gap:16px;
}

.card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:9px;
    overflow:hidden;
    transition:.2s;
    cursor:pointer;
}

.card:hover{
    transform:translateY(-5px);
    border-color:var(--red);
    box-shadow:0 15px 40px rgba(0,0,0,.45);
}

.card-image{
    height:145px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
    font-weight:1000;
    background:
        linear-gradient(135deg,rgba(227,38,46,.55),transparent),
        linear-gradient(135deg,#292929,#0c0c0c);
}

.card-body{
    padding:16px;
}

.card-body h3{
    font-size:19px;
}

.card-body p{
    color:#888;
    font-size:13px;
    line-height:1.5;
}

.tag{
    display:inline-block;
    padding:5px 8px;
    border-radius:4px;
    background:#292929;
    color:#aaa;
    font-size:10px;
    font-weight:1000;
    text-transform:uppercase;
    margin:3px 3px 0 0;
}

.tag.red-tag{
    color:#ff6870;
    background:rgba(227,38,46,.15);
}

.tag.gold-tag{
    color:#e6be45;
    background:rgba(214,169,40,.14);
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:22px;
}

.controls input,
.controls select{
    background:var(--panel);
    color:white;
    border:1px solid var(--line);
    padding:11px 12px;
    border-radius:6px;
    outline:none;
}

.controls input{
    min-width:300px;
}

.profile{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
}

.profile-header{
    min-height:310px;
    padding:38px;
    display:flex;
    align-items:end;
    gap:25px;
    background:
        linear-gradient(120deg,rgba(227,38,46,.42),transparent 60%),
        linear-gradient(135deg,#242424,#090909);
}

.avatar{
    width:155px;
    height:155px;
    flex-shrink:0;
    border-radius:10px;
    border:3px solid var(--red);
    background:#2d2d2d;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:46px;
    font-weight:1000;
}

.profile-name{
    font-size:55px;
    line-height:.9;
    letter-spacing:-4px;
    font-weight:1000;
}

.profile-subtitle{
    color:#aaa;
    margin-top:12px;
}

.profile-body{
    padding:30px;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin:22px 0;
}

.info-box{
    background:#202020;
    border:1px solid #303030;
    border-radius:7px;
    padding:15px;
}

.info-box small{
    display:block;
    color:#777;
    font-size:10px;
    font-weight:1000;
    text-transform:uppercase;
    margin-bottom:7px;
}

.info-box strong{
    font-size:15px;
}

.timeline{
    border-left:2px solid var(--red);
    padding-left:24px;
}

.timeline-item{
    position:relative;
    margin-bottom:25px;
}

.timeline-item:before{
    content:"";
    position:absolute;
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--red);
    left:-30px;
    top:3px;
}

.timeline-year{
    color:var(--red-light);
    font-weight:1000;
    font-size:13px;
}

.timeline-text{
    color:#aaa;
    margin-top:5px;
    line-height:1.5;
}

.map{
    height:650px;
    position:relative;
    overflow:hidden;
    border:1px solid var(--line);
    border-radius:12px;
    background:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),
        #111;
    background-size:45px 45px;
}

.map:before{
    content:"";
    position:absolute;
    inset:0;
    background:
        radial-gradient(circle at 50% 50%,rgba(227,38,46,.15),transparent 50%);
}

.map-location{
    position:absolute;
    transform:translate(-50%,-50%);
    z-index:2;
    cursor:pointer;
    text-align:center;
}

.map-dot{
    width:20px;
    height:20px;
    border-radius:50%;
    border:3px solid white;
    background:var(--red);
    box-shadow:0 0 25px rgba(227,38,46,.9);
    margin:auto;
}

.map-label{
    margin-top:8px;
    white-space:nowrap;
    background:#111;
    border:1px solid #444;
    padding:6px 9px;
    border-radius:5px;
    font-size:11px;
}

.sandbox-layout{
    display:grid;
    grid-template-columns:350px 1fr;
    gap:20px;
}

.sandbox-panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:22px;
}

.cast-list{
    max-height:630px;
    overflow-y:auto;
}

.cast-person{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px;
    margin-bottom:7px;
    background:#202020;
    border:1px solid #303030;
    border-radius:6px;
}

.cast-person button{
    background:var(--red);
    color:white;
    border:0;
    padding:5px 9px;
    border-radius:4px;
    font-weight:1000;
}

.show-preview{
    min-height:620px;
    padding:28px;
    border:1px solid #303030;
    border-radius:9px;
    background:
        linear-gradient(135deg,rgba(227,38,46,.25),transparent),
        #0c0c0c;
}

.role{
    padding:14px;
    margin:10px 0;
    border-left:3px solid var(--red);
    background:#1b1b1b;
}

.role strong{
    display:block;
    margin-bottom:5px;
}

.role span{
    color:#aaa;
    font-size:13px;
}

.trivia-box{
    max-width:1000px;
    padding:35px;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--panel);
}

.question{
    font-size:28px;
    font-weight:1000;
    margin-bottom:25px;
}

.answers{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.answer{
    text-align:left;
    background:#242424;
    color:white;
    border:1px solid #3a3a3a;
    border-radius:6px;
    padding:16px;
}

.answer:hover{
    border-color:var(--red);
}

.lore-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:16px;
}

.lore-card{
    padding:23px;
    border:1px solid #4c2020;
    border-radius:10px;
    background:
        linear-gradient(135deg,#251010,#161616);
}

.lore-card h3{
    color:#ff5a61;
}

.leaderboard{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
}

.leader-row{
    display:grid;
    grid-template-columns:60px 1fr 150px;
    align-items:center;
    padding:16px 20px;
    border-bottom:1px solid #292929;
}

.leader-row:last-child{
    border-bottom:0;
}

.rank{
    color:var(--red);
    font-size:23px;
    font-weight:1000;
}

.score{
    color:#aaa;
    text-align:right;
}

.achievement{
    padding:18px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
}

.achievement.unlocked{
    border-color:var(--gold);
    background:linear-gradient(135deg,rgba(214,169,40,.15),#151515);
}

.achievement-icon{
    font-size:28px;
    margin-bottom:10px;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:3000;
    padding:20px;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.83);
}

.modal.active{
    display:flex;
}

.modal-content{
    position:relative;
    width:100%;
    max-width:1150px;
    max-height:94vh;
    overflow-y:auto;
    padding:30px;
    border:1px solid #444;
    border-radius:12px;
    background:#151515;
}

.close{
    position:absolute;
    top:10px;
    right:18px;
    color:#888;
    font-size:30px;
    cursor:pointer;
}

.close:hover{
    color:white;
}

.empty{
    padding:35px;
    text-align:center;
    color:#777;
    border:1px dashed #333;
    border-radius:8px;
}

.footer{
    text-align:center;
    color:#555;
    border-top:1px solid var(--line);
    margin-top:75px;
    padding-top:25px;
    font-size:12px;
}

.secret-button{
    position:fixed;
    right:2px;
    bottom:2px;
    width:28px;
    height:28px;
    opacity:.01;
    cursor:pointer;
}

@media(max-width:1100px){

    .stats{
        grid-template-columns:repeat(3,1fr);
    }

    .sandbox-layout{
        grid-template-columns:1fr;
    }

    .global-search{
        width:220px;
    }

}

@media(max-width:750px){

    .nav{
        flex-wrap:wrap;
    }

    .global-search{
        order:3;
        width:100%;
    }

    .hero{
        padding:35px 24px;
    }

    .profile-header{
        flex-direction:column;
        align-items:flex-start;
    }

    .profile-name{
        font-size:40px;
    }

    .info-grid{
        grid-template-columns:1fr 1fr;
    }

    .answers{
        grid-template-columns:1fr;
    }

}

@media(max-width:500px){

    .page{
        padding:20px 14px 60px;
    }

    h1{
        font-size:53px;
    }

    .stats,
    .info-grid{
        grid-template-columns:1fr;
    }

    .controls input{
        min-width:100%;
    }

}

</style>
</head>
