<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STOOLVERSE — The Barstool Database</title>

<style>
:root{
    --red:#e3262e;
    --red2:#ff4b52;
    --black:#080808;
    --dark:#101010;
    --panel:#171717;
    --panel2:#202020;
    --line:#2d2d2d;
    --gray:#909090;
    --white:#f5f5f5;
}

*{box-sizing:border-box}

body{
    margin:0;
    background:
    radial-gradient(circle at 90% 0%,rgba(227,38,46,.12),transparent 28%),
    var(--black);
    color:var(--white);
    font-family:Arial,Helvetica,sans-serif;
}

button,input,select{font:inherit}
button{cursor:pointer}

.header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(8,8,8,.96);
    border-bottom:1px solid var(--line);
    backdrop-filter:blur(12px);
}

.nav{
    max-width:1600px;
    margin:auto;
    padding:16px 26px;
    display:flex;
    align-items:center;
    gap:24px;
}

.logo{
    font-size:28px;
    font-weight:1000;
    letter-spacing:-2px;
    cursor:pointer;
    white-space:nowrap;
}

.logo span{color:var(--red)}

.nav-links{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
}

.nav-links button{
    border:0;
    background:transparent;
    color:#999;
    padding:9px 11px;
    border-radius:6px;
    font-weight:800;
}

.nav-links button:hover,
.nav-links button.active{
    background:var(--red);
    color:#fff;
}

.search{
    margin-left:auto;
    width:260px;
}

.search input{
    width:100%;
    padding:11px 13px;
    border:1px solid #333;
    border-radius:7px;
    background:#171717;
    color:#fff;
    outline:none;
}

.search input:focus{border-color:var(--red)}

.page{
    max-width:1600px;
    margin:auto;
    padding:34px 26px 80px;
}

.hero{
    min-height:410px;
    padding:58px;
    border:1px solid var(--line);
    border-radius:15px;
    overflow:hidden;
    position:relative;
    background:
    linear-gradient(110deg,rgba(227,38,46,.28),transparent 55%),
    linear-gradient(135deg,#1d1d1d,#090909);
}

.hero:after{
    content:"STOOLVERSE";
    position:absolute;
    right:-30px;
    bottom:-45px;
    font-size:140px;
    font-weight:1000;
    color:rgba(255,255,255,.025);
}

.hero-content{position:relative;z-index:1;max-width:900px}

.kicker{
    color:var(--red2);
    font-size:12px;
    font-weight:1000;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:14px;
}

h1{
    margin:0 0 24px;
    font-size:clamp(48px,7vw,94px);
    line-height:.88;
    letter-spacing:-6px;
}

h2{
    font-size:32px;
    margin:0 0 18px;
}

h3{margin:0 0 10px}

.red{color:var(--red)}

.hero p{
    color:#aaa;
    font-size:18px;
    line-height:1.6;
    max-width:750px;
}

.section{margin-top:42px}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:end;
    gap:20px;
    margin-bottom:18px;
}

.section-header p{
    color:#888;
    margin:0;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(235px,1fr));
    gap:16px;
}

.card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    transition:.2s;
    cursor:pointer;
}

.card:hover{
    transform:translateY(-4px);
    border-color:var(--red);
    box-shadow:0 12px 35px rgba(0,0,0,.4);
}

.card-image{
    height:145px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:43px;
    font-weight:1000;
    background:
    linear-gradient(135deg,rgba(227,38,46,.55),transparent),
    linear-gradient(135deg,#292929,#0d0d0d);
}

.card-body{padding:16px}

.card-body h3{font-size:19px}

.card-body p{
    color:#888;
    font-size:13px;
    line-height:1.5;
    margin:6px 0 0;
}

.tag{
    display:inline-block;
    background:#292929;
    color:#bbb;
    padding:5px 8px;
    border-radius:4px;
    font-size:10px;
    font-weight:900;
    text-transform:uppercase;
    margin:4px 4px 0 0;
}

.tag.red-tag{
    color:#ff6269;
    background:rgba(227,38,46,.18);
}

.stats{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
    margin-top:28px;
}

.stat{
    padding:20px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:9px;
}

.stat-number{
    font-size:31px;
    font-weight:1000;
    color:var(--red);
}

.stat-label{
    color:#888;
    font-size:11px;
    margin-top:5px;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:22px;
}

.controls input,
.controls select{
    background:var(--panel);
    color:#fff;
    border:1px solid var(--line);
    padding:11px;
    border-radius:6px;
    outline:none;
}

.primary-btn,
.secondary-btn{
    padding:11px 16px;
    border-radius:6px;
    font-weight:900;
}

.primary-btn{
    background:var(--red);
    color:#fff;
    border:0;
}

.primary-btn:hover{background:#ff3038}

.secondary-btn{
    background:#242424;
    color:#fff;
    border:1px solid #3a3a3a;
}

.profile{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
}

.profile-top{
    min-height:285px;
    padding:35px;
    display:flex;
    align-items:end;
    background:
    linear-gradient(120deg,rgba(227,38,46,.4),transparent 60%),
    linear-gradient(135deg,#242424,#090909);
}

.profile-avatar{
    width:150px;
    height:150px;
    margin-right:25px;
    border-radius:10px;
    border:3px solid var(--red);
    display:flex;
    align-items:center;
    justify-content:center;
    background:#2d2d2d;
    font-size:48px;
    font-weight:1000;
}

.profile-name{
    font-size:50px;
    font-weight:1000;
    letter-spacing:-3px;
}

.profile-subtitle{
    color:#aaa;
    margin-top:8px;
}

.profile-body{padding:28px}

.info-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin:20px 0;
}

.info-box{
    background:#202020;
    border:1px solid #2c2c2c;
    border-radius:7px;
    padding:15px;
}

.info-box small{
    display:block;
    color:#777;
    font-size:10px;
    font-weight:1000;
    text-transform:uppercase;
    margin-bottom:6px;
}

.info-box strong{font-size:15px}

.timeline{
    border-left:2px solid var(--red);
    padding-left:22px;
}

.timeline-item{
    position:relative;
    margin-bottom:24px;
}

.timeline-item:before{
    content:"";
    width:10px;
    height:10px;
    background:var(--red);
    border-radius:50%;
    position:absolute;
    left:-28px;
    top:4px;
}

.timeline-year{
    color:var(--red2);
    font-weight:1000;
    font-size:13px;
}

.timeline-text{
    color:#bbb;
    margin-top:4px;
}

.map{
    height:580px;
    border:1px solid var(--line);
    border-radius:12px;
    position:relative;
    overflow:hidden;
    background:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),
    #101010;
    background-size:45px 45px;
}

.map:before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 50% 50%,rgba(227,38,46,.1),transparent 52%);
}

.map-location{
    position:absolute;
    transform:translate(-50%,-50%);
    cursor:pointer;
    z-index:2;
}

.map-dot{
    width:18px;
    height:18px;
    border-radius:50%;
    background:var(--red);
    border:3px solid white;
    box-shadow:0 0 20px rgba(227,38,46,.8);
}

.map-label{
    white-space:nowrap;
    background:#111;
    border:1px solid #444;
    padding:6px 8px;
    border-radius:5px;
    font-size:11px;
    margin-top:6px;
    transform:translateX(-30%);
}

.sandbox{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.sandbox-panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:22px;
}

.person-select{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#222;
    border:1px solid #333;
    padding:11px;
    margin-bottom:8px;
    border-radius:6px;
}

.person-select button{
    background:var(--red);
    color:white;
    border:0;
    border-radius:4px;
    padding:5px 8px;
    font-weight:1000;
}

.show-preview{
    min-height:390px;
    padding:25px;
    border:1px solid #292929;
    border-radius:8px;
    background:
    linear-gradient(135deg,rgba(227,38,46,.25),transparent),
    #0d0d0d;
}

.role{
    border-left:3px solid var(--red);
    background:#1a1a1a;
    padding:11px 14px;
    margin:10px 0;
}

.trivia-box{
    max-width:900px;
    padding:30px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
}

.question{
    font-size:24px;
    font-weight:900;
    margin-bottom:20px;
}

.answers{
    display:grid;
    gap:10px;
}

.answer{
    text-align:left;
    padding:14px;
    background:#242424;
    color:#fff;
    border:1px solid #383838;
    border-radius:6px;
}

.answer:hover{border-color:var(--red)}

.lore-card{
    padding:20px;
    border-radius:10px;
    border:1px solid #492020;
    background:linear-gradient(135deg,#211010,#171717);
}

.lore-card h3{color:#ff4b53}

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:500;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.8);
}

.modal.active{display:flex}

.modal-content{
    position:relative;
    width:100%;
    max-width:1000px;
    max-height:92vh;
    overflow-y:auto;
    padding:28px;
    border-radius:12px;
    border:1px solid #444;
    background:#151515;
}

.close{
    position:absolute;
    top:12px;
    right:18px;
    font-size:27px;
    color:#888;
    cursor:pointer;
}

.close:hover{color:white}

.empty{
    padding:30px;
    text-align:center;
    color:#777;
    border:1px dashed #333;
    border-radius:8px;
}

.footer{
    margin-top:70px;
    padding-top:25px;
    border-top:1px solid var(--line);
    color:#666;
    text-align:center;
    font-size:12px;
}

.secret{
    position:fixed;
    bottom:2px;
    right:2px;
    width:30px;
    height:30px;
    opacity:.01;
    cursor:pointer;
}

@media(max-width:1000px){
    .nav{flex-wrap:wrap}
    .search{
        order:3;
        width:100%;
        margin-left:0;
    }
    .stats{grid-template-columns:repeat(3,1fr)}
    .sandbox{grid-template-columns:1fr}
}

@media(max-width:700px){
    .stats,.info-grid{grid-template-columns:1fr 1fr}
    .profile-top{
        flex-direction:column;
        align-items:flex-start;
    }
    .profile-avatar{
        margin:0 0 20px;
    }
}

@media(max-width:500px){
    .page{padding:20px 14px 50px}
    .hero{padding:30px 22px}
    h1{font-size:50px}
    .stats,.info-grid{grid-template-columns:1fr}
    .profile-name{font-size:36px}
}
</style>
</head>

</nav>

function filterPeople(query){

const result=people.filter(p=>

`${p.name}
${p.role}
${p.category}
${p.school}
${p.hometown}
${p.description}
${p.tags.join(" ")}
${p.shows.join(" ")}
${p.teams.join(" ")}
${p.relationships.join(" ")}`
.toLowerCase()
.includes(query.toLowerCase())

);

document.getElementById("peopleGrid").innerHTML=

result.length
?result.map(personCard).join("")
:`<div class="empty">No people found.</div>`;

}

function filterCategory(category){

if(category==="all")return renderPeople();

renderPeople(people.filter(p=>p.category===category));

}

function addToSandbox(id){

if(!selectedSandboxPeople.includes(id))
selectedSandboxPeople.push(id);

if(document.getElementById("sandboxOutput"))
updateSandbox();
else
showPage("sandbox");

}

function updateSandbox(){

const output=document.getElementById("sandboxOutput");

if(!output)return;

const selected=selectedSandboxPeople
.map(id=>people.find(p=>p.id===id))
.filter(Boolean);

if(!selected.length){

output.innerHTML=`
<p style="color:#777;">
Add personalities to generate the show's chemistry.
</p>
`;

return;

}

output.innerHTML=`

<p style="color:#aaa;">
Current cast:
</p>

${selected.map((p,i)=>`

<div class="role">

<strong>${p.name}</strong>

<br>

<span style="color:#888;">

${i===0
?"Likely central host / anchor"
:i===1
?"Primary co-host / counterbalance"
:"Chaos agent / supporting personality"}

</span>

</div>

`).join("")}

`;

}

function generateShow(){

const selected=selectedSandboxPeople
.map(id=>people.find(p=>p.id===id))
.filter(Boolean);

if(!selected.length)return;

const title=selected
.map(p=>p.name.split(" ")[0])
.join(" & ")+" Show";

document.getElementById("sandboxTitle").textContent=title;

let chaos=Math.min(100,selected.length*17);

document.getElementById("sandboxOutput").innerHTML=`

<div class="role">

<strong>Show Identity</strong>

<br>

<span style="color:#aaa;">
A personality-driven show built around
${selected.map(p=>p.name).join(", ")}.
</span>

</div>

<div class="role">

<strong>Central Host</strong>

<br>

<span style="color:#aaa;">
${selected[0].name}
would likely become the main anchor.
</span>

</div>

<div class="role">

<strong>Primary Counterbalance</strong>

<br>

<span style="color:#aaa;">
${selected[1]
?selected[1].name
:"The audience"}
would create the main contrast.
</span>

</div>

<div class="role">

<strong>Chaos Level</strong>

<br>

<span style="color:#aaa;">
${chaos}/100
</span>

</div>

<div class="role">

<strong>Rabbit Hole Potential</strong>

<br>

<span style="color:#aaa;">
${Math.min(100,chaos+selected.length*9)}/100
</span>

</div>

<div class="role">

<strong>Likely Dynamic</strong>

<br>

<span style="color:#aaa;">
The show would combine
${selected.map(p=>p.tags[0]||"personality").join(", ")}
into an unpredictable format.
</span>

</div>

`;

}

function clearSandbox(){

selectedSandboxPeople=[];

renderSandbox();

}

function answerTrivia(index){

const q=triviaQuestions[currentTrivia];

if(index===q.correct)
triviaScore++;

currentTrivia++;

if(currentTrivia>=triviaQuestions.length){

document.getElementById("app").innerHTML=`

<div class="trivia-box">

<div class="kicker">Final Score</div>

<h2>
${triviaScore} / ${triviaQuestions.length}
</h2>

<p style="color:#aaa;">
The rabbit hole continues.
</p>

<button
class="primary-btn"
onclick="currentTrivia=0;triviaScore=0;renderTrivia()"
>
Play Again
</button>

</div>

`;

}else{

renderTrivia();

}

}

function rabbitHole(id){

const p=people.find(x=>x.id===id);

if(!p)return;

const connected=p.relationships
.map(name=>people.find(x=>x.name===name))
.filter(Boolean);

document.getElementById("modalContent").innerHTML=`

<div class="kicker">Rabbit Hole Started</div>

<h2>
You started with ${p.name}.
</h2>

<p style="color:#aaa;line-height:1.7;">
The obvious next connections are:
</p>

<div class="grid">

${connected.length

?connected.map(personCard).join("")

:`<div class="empty">
More connections are waiting to be added.
</div>`}

</div>

<p style="color:#777;margin-top:20px;">
This is where the database becomes a rabbit hole
instead of a directory.
</p>

`;

openModal();

}

/* =========================================================
   SEARCH
========================================================= */

function globalSearch(query){

if(!query.trim())return;

const results=people.filter(p=>

`${p.name}
${p.role}
${p.category}
${p.school}
${p.hometown}
${p.description}
${p.tags.join(" ")}
${p.shows.join(" ")}
${p.teams.join(" ")}
${p.relationships.join(" ")}`
.toLowerCase()
.includes(query.toLowerCase())

);

if(results.length)
renderPeople(results);

}

function openModal(){
document.getElementById("modal").classList.add("active");
}

function closeModal(){
document.getElementById("modal").classList.remove("active");
}

document.getElementById("modal").addEventListener("click",e=>{

closeModal();

});

keySequence.shift();

document.getElementById("modalContent").innerHTML=`

<div class="kicker">

</div>

<h2>
You found the Yak.
</h2>

<p style="color:#aaa;">
Some Easter eggs should not be explained.
</p>

`;

keySequence=[];

}

});
