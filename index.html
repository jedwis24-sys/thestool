<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stool Dynasty</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #080808;
    --panel: #111;
    --panel2: #181818;
    --panel3: #202020;
    --border: #303030;
    --red: #d71920;
    --red2: #ff3038;
    --text: #f5f5f5;
    --muted: #929292;
    --green: #27c76f;
    --yellow: #d9b329;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    min-height: 100vh;
}

/* =========================
   TOP BAR
========================= */

.topbar {
    height: 70px;
    background: #101010;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    position: sticky;
    top: 0;
    z-index: 50;
}

.logo {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -1px;
    cursor: pointer;
}

.logo span {
    color: var(--red);
}

.top-right {
    display: flex;
    gap: 22px;
    align-items: center;
}

.top-stat {
    color: var(--muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.top-stat strong {
    display: block;
    color: white;
    font-size: 15px;
    margin-bottom: 3px;
}

/* =========================
   LAYOUT
========================= */

.layout {
    display: flex;
    min-height: calc(100vh - 70px);
}

.sidebar {
    width: 235px;
    flex-shrink: 0;
    background: #0e0e0e;
    border-right: 1px solid var(--border);
    padding: 20px 12px;
}

.sidebar-label {
    color: #666;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin: 17px 12px 8px;
}

.nav-button {
    width: 100%;
    border: none;
    background: transparent;
    color: #aaa;
    text-align: left;
    padding: 13px 14px;
    border-radius: 6px;
    margin-bottom: 3px;
    font-size: 14px;
    transition: .2s;
}

.nav-button:hover {
    background: #1e1e1e;
    color: white;
}

.nav-button.active {
    background: #242424;
    color: white;
    border-left: 3px solid var(--red);
}

.content {
    flex: 1;
    padding: 34px;
    overflow-x: hidden;
}

.page-title {
    font-size: 36px;
    font-weight: 900;
    letter-spacing: -1px;
    margin-bottom: 7px;
}

.page-subtitle {
    color: var(--muted);
    margin-bottom: 28px;
    line-height: 1.5;
}

/* =========================
   BUTTONS
========================= */

.primary-btn {
    background: var(--red);
    border: none;
    color: white;
    padding: 13px 20px;
    border-radius: 5px;
    font-weight: bold;
    transition: .2s;
}

.primary-btn:hover {
    background: var(--red2);
    transform: translateY(-1px);
}

.secondary-btn {
    background: #252525;
    border: 1px solid #444;
    color: white;
    padding: 12px 18px;
    border-radius: 5px;
}

.secondary-btn:hover {
    background: #333;
}

.danger-btn {
    background: #4d1111;
    color: #ff7777;
    border: 1px solid #762020;
    padding: 10px 15px;
    border-radius: 5px;
}

/* =========================
   DASHBOARD
========================= */

.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 35px;
}

.mode-card {
    background: linear-gradient(145deg, #1c1c1c, #111);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px;
    min-height: 145px;
    transition: .2s;
    cursor: pointer;
}

.mode-card:hover {
    border-color: var(--red);
    transform: translateY(-3px);
}

.mode-icon {
    font-size: 30px;
    margin-bottom: 13px;
}

.mode-card h3 {
    margin-bottom: 8px;
    font-size: 18px;
}

.mode-card p {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
}

.dashboard-bottom {
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 20px;
}

.panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px;
}

.panel-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 16px;
}

.news-item {
    border-bottom: 1px solid #292929;
    padding: 13px 0;
    font-size: 14px;
}

.news-item:last-child {
    border-bottom: none;
}

.news-item small {
    display: block;
    color: #777;
    margin-top: 5px;
}

/* =========================
   MAP
========================= */

.map {
    height: 570px;
    position: relative;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 12px;
    background:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
        #151515;
    background-size: 45px 45px;
}

.map-title {
    position: absolute;
    top: 20px;
    left: 25px;
    color: #4c4c4c;
    letter-spacing: 4px;
    font-size: 11px;
}

.map-line {
    position: absolute;
    height: 2px;
    background: #333;
    transform-origin: left center;
    opacity: .7;
}

.location {
    position: absolute;
    transform: translate(-50%, -50%);
    text-align: center;
    cursor: pointer;
}

.location-dot {
    width: 23px;
    height: 23px;
    background: var(--red);
    border-radius: 50%;
    margin: auto;
    box-shadow: 0 0 22px rgba(215,25,32,.7);
    transition: .2s;
}

.location:hover .location-dot {
    transform: scale(1.5);
}

.location-name {
    margin-top: 9px;
    font-size: 13px;
    font-weight: bold;
}

.location-count {
    color: #777;
    font-size: 10px;
    margin-top: 3px;
}

.chicago {
    left: 30%;
    top: 39%;
}

.new-york {
    left: 73%;
    top: 33%;
}

.philly {
    left: 68%;
    top: 50%;
}

.boston {
    left: 82%;
    top: 19%;
}

.las-vegas {
    left: 14%;
    top: 58%;
}

.other {
    left: 48%;
    top: 74%;
}

/* =========================
   PLAYER DATABASE
========================= */

.toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.search {
    background: #171717;
    border: 1px solid #393939;
    color: white;
    padding: 12px 15px;
    border-radius: 5px;
    min-width: 280px;
}

.filter {
    background: #171717;
    border: 1px solid #393939;
    color: white;
    padding: 12px 15px;
    border-radius: 5px;
}

.player-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.player-card {
    background: linear-gradient(145deg, #202020, #111);
    border: 1px solid #343434;
    border-radius: 9px;
    overflow: hidden;
    cursor: pointer;
    transition: .2s;
}

.player-card:hover {
    transform: translateY(-4px);
    border-color: var(--red);
}

.player-image {
    height: 125px;
    background: linear-gradient(135deg, #333, #171717);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    font-weight: 900;
    color: #777;
}

.player-info {
    padding: 14px;
}

.player-name {
    font-size: 16px;
    font-weight: bold;
}

.player-role {
    color: #888;
    font-size: 11px;
    text-transform: uppercase;
    margin-top: 4px;
}

.player-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 14px;
}

.ovr {
    font-size: 26px;
    font-weight: 900;
}

.ovr-label {
    color: #777;
    font-size: 9px;
}

.tags {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: 12px;
}

.tag {
    background: #2b2b2b;
    color: #aaa;
    font-size: 9px;
    padding: 4px 6px;
    border-radius: 3px;
}

/* =========================
   SHOW BUILDER
========================= */

.builder-layout {
    display: grid;
    grid-template-columns: 1fr 1.2fr;
    gap: 22px;
}

.format-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.format-card {
    background: #1a1a1a;
    border: 1px solid #333;
    padding: 16px;
    border-radius: 7px;
    cursor: pointer;
    transition: .2s;
}

.format-card:hover,
.format-card.selected {
    border-color: var(--red);
    background: #281414;
}

.format-card strong {
    display: block;
    margin-bottom: 5px;
}

.format-card small {
    color: #888;
    line-height: 1.4;
}

.cast-slots {
    margin-top: 20px;
}

.cast-slot {
    background: #181818;
    border: 1px dashed #444;
    min-height: 55px;
    border-radius: 6px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    padding: 10px 13px;
    justify-content: space-between;
}

.cast-slot.empty {
    color: #666;
}

.cast-slot-name {
    font-weight: bold;
}

.cast-slot-role {
    color: #777;
    font-size: 11px;
}

.cast-list {
    max-height: 520px;
    overflow-y: auto;
}

.cast-option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px;
    border-bottom: 1px solid #292929;
    cursor: pointer;
}

.cast-option:hover {
    background: #202020;
}

.cast-option-info {
    display: flex;
    align-items: center;
    gap: 11px;
}

.mini-avatar {
    width: 35px;
    height: 35px;
    background: #333;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    font-size: 12px;
    font-weight: bold;
}

.add-button {
    background: #292929;
    color: white;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 6px 10px;
}

.result-box {
    margin-top: 22px;
    background: linear-gradient(145deg, #211111, #111);
    border: 1px solid #602020;
    border-radius: 9px;
    padding: 22px;
}

.result-score {
    font-size: 55px;
    font-weight: 900;
    color: var(--red2);
}

.stat-row {
    margin: 12px 0;
}

.stat-header {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-bottom: 5px;
}

.stat-bar {
    height: 8px;
    background: #292929;
    border-radius: 4px;
    overflow: hidden;
}

.stat-fill {
    height: 100%;
    background: var(--red);
    border-radius: 4px;
}

/* =========================
   YAK WHEEL
========================= */

.wheel-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
}

.wheel {
    width: 330px;
    height: 330px;
    border-radius: 50%;
    margin: 20px auto;
    background: conic-gradient(
        #d71920 0deg 45deg,
        #222 45deg 90deg,
        #d71920 90deg 135deg,
        #222 135deg 180deg,
        #d71920 180deg 225deg,
        #222 225deg 270deg,
        #d71920 270deg 315deg,
        #222 315deg 360deg
    );
    border: 8px solid #444;
    box-shadow: 0 0 35px rgba(0,0,0,.8);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 3s cubic-bezier(.15,.8,.2,1);
}

.wheel-center {
    width: 90px;
    height: 90px;
    background: #111;
    border: 4px solid #555;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 13px;
}

.wheel-result {
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    margin-top: 18px;
    min-height: 35px;
}

.wheel-controls {
    display: grid;
    gap: 14px;
}

.wheel-control {
    background: #171717;
    border: 1px solid #333;
    padding: 17px;
    border-radius: 7px;
}

.wheel-control label {
    display: block;
    color: #888;
    font-size: 11px;
    text-transform: uppercase;
    margin-bottom: 7px;
}

/* =========================
   WHO AM I
========================= */

.guess-input {
    width: 100%;
    background: #161616;
    border: 1px solid #444;
    color: white;
    padding: 14px;
    border-radius: 5px;
    margin-bottom: 10px;
}

.guess-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 22px;
}

.guess-table th {
    color: #777;
    font-size: 10px;
    text-transform: uppercase;
    padding: 10px 5px;
    text-align: center;
}

.guess-table td {
    border: 1px solid #333;
    padding: 13px 6px;
    text-align: center;
    font-size: 12px;
    font-weight: bold;
}

.green {
    background: #1c6e43;
}

.yellow {
    background: #806d18;
}

.gray {
    background: #303030;
    color: #888;
}

.guess-name {
    text-align: left !important;
    background: #1a1a1a !important;
}

/* =========================
   RANDOMIZER
========================= */

.random-result {
    min-height: 200px;
    background: #171717;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 25px;
    margin-top: 20px;
}

.random-result h2 {
    margin-bottom: 15px;
}

.random-result p {
    color: #bbb;
    line-height: 1.7;
}

/* =========================
   MEDICAL
========================= */

.injury-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.injury-card {
    background: #171717;
    border: 1px solid #333;
    padding: 20px;
    border-radius: 8px;
}

.injury-card h3 {
    margin-bottom: 8px;
}

.injury-card p {
    color: #888;
    font-size: 13px;
    line-height: 1.5;
}

.injury-badge {
    display: inline-block;
    margin-top: 15px;
    background: #401717;
    color: #ff6f6f;
    padding: 5px 8px;
    font-size: 10px;
    border-radius: 3px;
}

/* =========================
   MODAL
========================= */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.8);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-box {
    width: min(700px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    background: #171717;
    border: 1px solid #444;
    border-radius: 10px;
    padding: 25px;
}

.modal-top {
    display: flex;
    justify-content: space-between;
    align-items: start;
    margin-bottom: 20px;
}

.close {
    background: transparent;
    border: none;
    color: #888;
    font-size: 25px;
}

.detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.detail-stat {
    background: #202020;
    padding: 13px;
    border-radius: 5px;
}

.detail-stat span {
    color: #888;
    font-size: 11px;
    display: block;
    margin-bottom: 5px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width: 1100px) {
    .player-grid {
        grid-template-columns: repeat(3, 1fr);
    }

    .dashboard-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 800px) {
    .sidebar {
        display: none;
    }

    .content {
        padding: 20px;
    }

    .builder-layout,
    .wheel-layout,
    .dashboard-bottom {
        grid-template-columns: 1fr;
    }

    .player-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .injury-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 550px) {
    .player-grid,
    .dashboard-grid,
    .injury-grid {
        grid-template-columns: 1fr;
    }

    .top-right {
        display: none;
    }

    .content {
        padding: 15px;
    }
}
</style>
</head>

function saveGame() {
    localStorage.setItem("stoolDynastySave", JSON.stringify(state));
    updateTopbar();
}

function updateTopbar() {
    document.getElementById("budgetDisplay").textContent =
        "$" + (state.budget / 1000000).toFixed(1) + "M";

    document.getElementById("showDisplay").textContent =
        state.shows.length;

    document.getElementById("fanDisplay").textContent =
        state.fans.toLocaleString();
}

function showPage(page) {

    document.querySelectorAll(".nav-button").forEach(button => {
        button.classList.remove("active");
    });

    if(page === "dashboard") renderDashboard();
    if(page === "dynasty") renderDynasty();
    if(page === "builder") renderBuilder();
    if(page === "wheel") renderWheel();
    if(page === "whoami") renderWhoAmI();
    if(page === "randomizer") renderRandomizer();
    if(page === "players") renderPlayers();
    if(page === "map") renderMap();
    if(page === "medical") renderMedical();
    if(page === "hall") renderHall();

    window.scrollTo(0,0);
}

function dynastyEvent() {

            text:"🚨 Mintzy has shown up to a show he was not booked for.",
            effect:"Chaos +25 • Schedule Reliability -15 • Clip Potential +40"
        },

        {
            text:"📈 One of your shows went viral overnight.",
            effect:"Fans +250,000 • Budget +$1,000,000"
        },

        {
            text:"🏥 A key personality has suffered an extremely preventable injury.",
            effect:"Show Chemistry -10 • Medical Bills +$250,000"
        },

        {
            text:"🎙️ Your producer has created a new show idea.",
            effect:"You may have accidentally discovered the next biggest show in the universe."
        },

        {
            text:"🔥 Two members of your roster have started a rivalry.",
            effect:"Drama +40 • Clip Potential +30 • Chemistry -15"
        },

        {
            text:"🧠 Your trivia team has discovered a completely useless piece of knowledge.",
            effect:"Knowledge +1 • Nobody knows what to do with it."
        }

    ];

    const event = events[Math.floor(Math.random()*events.length)];

    if(event.text.includes("viral")) {
        state.fans += 250000;
        state.budget += 1000000;
        saveGame();
    }

    document.getElementById("dynastyEventResult").innerHTML = `

    <div class="result-box">

        <h2>${event.text}</h2>

        <p style="color:#aaa;margin-top:12px;">
            ${event.effect}
        </p>

    </div>

}

function selectFormat(index, element) {

    selectedFormat = formats[index];

    document.querySelectorAll(".format-card")
        .forEach(card => card.classList.remove("selected"));

    element.classList.add("selected");

}

function filterBuilderPeople(query) {

    const people = document.querySelectorAll(".cast-option");

    people.forEach(person => {

        const name = person.dataset.name;

        person.style.display =
            name.includes(query.toLowerCase())
            ? "flex"
            : "none";

    });

}

function addToCast(index) {

    const player = players[index];

    if(selectedCast.some(p => p.name === player.name)) {
        return;
    }

    if(selectedCast.length >= 8) {
        alert("Maximum 8 people in a show.");
        return;
    }

    selectedCast.push(player);

    renderCastSlots();

}

function removeFromCast(index) {

    selectedCast.splice(index,1);

    renderCastSlots();

}

function renderCastSlots() {

    const container = document.getElementById("castSlots");

    if(selectedCast.length === 0) {

        container.innerHTML = `
            <div class="cast-slot empty">
                No cast members selected.
            </div>
        `;

        return;
    }

    container.innerHTML = selectedCast.map((player,index)=>`

        <div class="cast-slot">

            <div>

                <div class="cast-slot-name">
                    ${player.name}
                </div>

                <div class="cast-slot-role">
                    ${player.role} • OVR ${player.overall}
                </div>

            </div>

            <button class="danger-btn"
                onclick="removeFromCast(${index})">
                REMOVE
            </button>

        </div>

    `).join("");

}

function buildShow() {

    if(selectedCast.length < 2) {
        alert("You need at least two people to create a show.");
        return;
    }

    const weights = selectedFormat.weights;

    let scores = {};

    weights.forEach(stat => {

        scores[stat] = Math.round(
            selectedCast.reduce((sum,player)=>sum + player[stat],0)
            / selectedCast.length
        );

    });

    let chemistry = Math.round(
        selectedCast.reduce((sum,player)=>sum + player.chemistry,0)
        / selectedCast.length
    );

    let chaos = Math.round(
        selectedCast.reduce((sum,player)=>sum + player.chaos,0)
        / selectedCast.length
    );

    let overall = Math.round(
        Object.values(scores).reduce((a,b)=>a+b,0)
        / Object.values(scores).length
    );

    overall += Math.min(8, selectedCast.length);

    overall = Math.min(99, overall);

    const names = selectedCast.map(p=>p.name);

    let showName = generateShowName();

    let description = generateDescription(overall, chaos, chemistry);

    const newShow = {
        name:showName,
        format:selectedFormat.name,
        overall,
        description,
        cast:names
    };

    state.shows.push(newShow);

    state.fans += overall * 1000;

    state.budget += Math.round(overall * 25000);

    saveGame();

    document.getElementById("content").innerHTML += `

    <div class="result-box">

        <h2>🚨 SHOW LAUNCHED</h2>

        <br>

        <h1>${showName}</h1>

        <p style="color:#aaa;margin-top:7px;">
            ${selectedFormat.icon} ${selectedFormat.name}
        </p>

        <br>

        <div class="result-score">${overall}</div>

        <p>OVERALL SHOW RATING</p>

        <br>

        <div class="stat-row">

            <div class="stat-header">
                <span>CHEMISTRY</span>
                <strong>${chemistry}</strong>
            </div>

            <div class="stat-bar">
                <div class="stat-fill" style="width:${chemistry}%"></div>
            </div>

        </div>

        <div class="stat-row">

            <div class="stat-header">
                <span>CHAOS</span>
                <strong>${chaos}</strong>
            </div>

            <div class="stat-bar">
                <div class="stat-fill" style="width:${chaos}%"></div>
            </div>

        </div>

        <br>

        <h3>CAST</h3>

        <p style="color:#bbb;margin-top:8px;">
            ${names.join(" • ")}
        </p>

        <br>

        <p style="font-size:16px;color:#ddd;">
            "${description}"
        </p>

        <br>

        <button class="secondary-btn"
            onclick="showPage('dynasty')">
            VIEW IN DYNASTY
        </button>

    </div>

    `;

}

   SHOW GENERATOR
===================================================== */

function generateShowName() {

    const first = [
        "The",
        "The New",
        "The Unnecessary",
        "The Daily",
        "The Completely Unplanned",
        "The Stool",
        "The Content"
    ];

    const second = [
        "Rundown",
        "Room",
        "Machine",
        "Experiment",
        "Show",
        "Club",
        "Factory",
        "Department",
        "Hour",
        "Situation",
        "Problem",
        "Universe"
    ];

    return first[Math.floor(Math.random()*first.length)]
        + " "
        + second[Math.floor(Math.random()*second.length)];

}

function generateDescription(overall, chaos, chemistry) {

    if(chaos >= 95) {
        return "An alarmingly unstable lineup that somehow produces elite content.";
    }

    if(chemistry >= 95) {
        return "The personalities have accidentally created a perfect content ecosystem.";
    }

    if(overall >= 95) {
        return "A generational lineup with enough talent to become the flagship of the entire universe.";
    }

    if(overall >= 88) {
        return "A very good show with a non-zero chance of completely losing control.";
    }

    return "There is definitely something here. The question is whether anyone knows what it is.";

}

function makeGuess() {

    const input = document.getElementById("guessInput");

    const value = input.value.trim().toLowerCase();

    const guess = players.find(
        p => p.name.toLowerCase() === value
    );

    if(!guess) {

        return;
    }

    if(whoGuesses.some(g=>g.name === guess.name)) {
        alert("You already guessed them.");
        return;
    }

    whoGuesses.push(guess);

    renderGuesses();

    if(guess.name === whoAnswer.name) {

        setTimeout(()=>{

            document.getElementById("guessArea").innerHTML += `

                <div class="result-box">

                    <h2>🟩 YOU GOT IT</h2>

                        onclick="newWhoGame()">

                    </button>

                </div>

            `;

        },200);

    }

}

function renderGuesses() {

    const area = document.getElementById("guessArea");

    if(!area) return;

    if(whoGuesses.length === 0) {

        area.innerHTML = `
            <p style="color:#666;margin-top:20px;">
                Your guesses will appear here.
            </p>
        `;

        return;

    }

    area.innerHTML = `

                <th>Person</th>
                <th>Role</th>
                <th>City</th>
                <th>Era</th>
                <th>OVR</th>
                <th>Comedy</th>
                <th>Sports</th>
                <th>Chaos</th>

            </tr>

        </thead>

        <tbody>

            ${whoGuesses.map(guess=>`

                <tr>

                    <td class="guess-name">
                        ${guess.name}
                    </td>

                    <td class="${compare(guess.role,whoAnswer.role)}">
                        ${guess.role}
                    </td>

                    <td class="${compare(guess.city,whoAnswer.city)}">
                        ${guess.city}
                    </td>

                    <td class="${compare(guess.era,whoAnswer.era)}">
                        ${guess.era}
                    </td>

                    <td class="${numberClass(guess.overall,whoAnswer.overall)}">
                        ${guess.overall}
                    </td>

                    <td class="${numberClass(guess.comedy,whoAnswer.comedy)}">
                        ${guess.comedy}
                    </td>

                    <td class="${numberClass(guess.sports,whoAnswer.sports)}">

                        ${guess.chaos}
                    </td>

                </tr>

            `).join("")}

        </tbody>

    </table>

    `;

}

function compare(a,b) {

    if(a === b) return "green";

    return "gray";

}

function numberClass(a,b) {

    if(a === b) return "green";

    if(Math.abs(a-b) <= 8) return "yellow";

    return "gray";

}

function newWhoGame() {

    whoAnswer = players[Math.floor(Math.random()*players.length)];

    whoGuesses = [];

    renderWhoAmI();

}

function filterPlayers() {

    const search =
        document.getElementById("playerSearch").value.toLowerCase();

    const city =
        document.getElementById("cityFilter").value;

    const role =
        document.getElementById("roleFilter").value;

    const filtered = players.filter(player => {

        const matchesSearch =
            player.name.toLowerCase().includes(search);

        const matchesCity =
            city === "all" || player.city === city;

        const matchesRole =
            role === "all" || player.role.includes(role);

        return matchesSearch && matchesCity && matchesRole;

    });

    document.getElementById("playerGrid").innerHTML =
        playerCards(filtered);

}

function getInitials(name) {

    return name
        .split(" ")
        .map(word=>word[0])
        .join("")
        .slice(0,3)
        .toUpperCase();

}

    <div class="panel">

        <h2>🩺 OPERATING ROOM</h2>

        <p style="color:#888;margin:10px 0 18px;">
            Select a patient. Perform a completely unnecessary procedure.
        </p>

        <select class="filter" id="operationPatient">

            ${players.slice(0,20)
                .map(p=>`<option>${p.name}</option>`)
                .join("")}

        </select>

        <br><br>

        <button class="primary-btn" onclick="performOperation()">
            PERFORM OPERATION
        </button>

        <div id="operationResult"></div>

    </div>

    `;

}

function performOperation() {

    const patient =
        document.getElementById("operationPatient").value;

    const results = [

        "SUCCESS. The patient is somehow worse but technically alive.",

        "SUCCESS. +5 Toughness. -10 Medical Knowledge.",

        "FAILURE. The wrong body part was operated on.",

        "SUCCESS. The injury has been upgraded to legendary status.",

        "PROCEDURE COMPLETE. Nobody knows what was actually done.",

        "THE OPERATION HAS CREATED A NEW EASTER EGG."

    ];

    const result =
        results[Math.floor(Math.random()*results.length)];

    document.getElementById("operationResult").innerHTML = `

        <div class="result-box">

            <h2>${patient}</h2>

            <p style="margin-top:10px;color:#bbb;">
                ${result}
            </p>

        </div>

    `;

}

/* =====================================================
   HALL OF FAME
===================================================== */

function renderHall() {

    document.getElementById("content").innerHTML = `

    <h1 class="page-title">🏆 Hall of Fame</h1>

    <p class="page-subtitle">
        The greatest achievements in your Stool Dynasty.
    </p>

    <div class="panel">

        <h2>YOUR DYNASTY RECORD</h2>

        <br>

        <div class="detail-grid">

            <div class="detail-stat">
                <span>SHOWS CREATED</span>
                ${state.shows.length}
            </div>

            <div class="detail-stat">
                <span>BEST SHOW</span>
                ${
                    state.shows.length
                    ?
                    Math.max(...state.shows.map(s=>s.overall))
                    :
                    "N/A"
                }
            </div>

            <div class="detail-stat">
                <span>TOTAL FANS</span>
                ${state.fans.toLocaleString()}
            </div>

            <div class="detail-stat">
                <span>SECRET DISCOVERIES</span>
                ${state.easterEggs.length}
            </div>

        </div>

    </div>

    <br>

    <h2 class="section-title">📺 Greatest Shows</h2>

    <div class="player-grid">

        ${
            state.shows.length === 0
            ?
            `<div class="panel">
                Nothing here yet.
            </div>`
            :
            state.shows
                .sort((a,b)=>b.overall-a.overall)
                .map(show=>`

                    <div class="panel">

                        <h2>${show.name}</h2>

                        <p style="color:#888;margin:8px 0;">
                            ${show.format}
                        </p>

                        <div class="result-score">
                            ${show.overall}
                        </div>

                        <p>OVR</p>

                    </div>

                `)
                .join("")
        }

    </div>

    `;

}

===================================================== */

    document.getElementById("modalContent").innerHTML = `

        <div style="font-size:60px;font-weight:900;color:var(--red);">
            ${player.overall}
        </div>

        <p style="color:#777;">
            OVERALL RATING
        </p>

        <br>

        <div class="detail-grid">

            <div class="detail-stat">
                <span>COMEDY</span>

            <div class="detail-stat">

            <div class="detail-stat">

            </div>

                <span>CHEMISTRY</span>
                ${player.chemistry}
            </div>

            <div class="detail-stat">

}
